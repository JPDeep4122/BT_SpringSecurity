<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav class="topbar">
        <a th:href="@{/}" class="brand">
            UTEShop
        </a>
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="account" style="display:flex; align-items:center; gap:12px; margin-left:auto;">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar"
                 width="40"
                 height="40"
                 style="border-radius:50%; object-fit:cover;">
            <!-- Full name -->
            <span th:text="${#authentication.principal.fullName}">
                Nguyễn Văn A
            </span>
            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'">
                (nguyenvana)
            </span>
            <!-- Email -->
            <span th:text="${#authentication.principal.email}">
                email@gmail.com
            </span>
            <!-- Role -->
            <span th:text="${#authentication.principal.role}" style="background:#2563eb; padding:3px 8px; border-radius:4px; font-size:12px;">
                ROLE_USER
            </span>
            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="link-button">
                    Đăng xuất
                </button>
            </form>
        </div>
        <div th:unless="${#authorization.expression('isAuthenticated()')}" class="account" style="margin-left:auto;">
            <a th:href="@{/login}" class="link-button" style="text-decoration:none; font-weight:600;">
                Đăng nhập
            </a>
        </div>
    </nav>
</header>
</body>
</html>
